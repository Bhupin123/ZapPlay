<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Snake — ZapPlay</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
#hud{display:flex;gap:24px;color:#fff;font-size:14px;font-weight:600}
#hud span{background:#1a1a2e;padding:6px 16px;border-radius:8px}
#hud .val{color:#e8ff47}
canvas{border-radius:12px;border:2px solid #1a1a2e;display:block}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.75);border-radius:12px;gap:12px;pointer-events:none}
#msg h2{font-family:'Segoe UI',sans-serif;font-size:2.2rem;font-weight:900;color:#e8ff47;letter-spacing:2px}
#msg p{color:#888;font-size:.95rem}
#msg .sub{color:#ccc;font-size:.85rem}
#startBtn{padding:12px 32px;background:#e8ff47;color:#000;border:none;border-radius:10px;font-size:1rem;font-weight:800;cursor:pointer;pointer-events:all;transition:transform .15s}
#startBtn:hover{transform:scale(1.05)}
#controls{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:4px}
.crow{display:flex;gap:4px}
.cbtn{width:44px;height:44px;background:#1a1a2e;border:1px solid #2a2a3e;border-radius:8px;color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;-webkit-tap-highlight-color:transparent}
.cbtn:active{background:#e8ff47;color:#000}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>Score: <span class="val" id="score">0</span></span>
    <span>Best: <span class="val" id="best">0</span></span>
    <span>Level: <span class="val" id="level">1</span></span>
  </div>
  <div style="position:relative">
    <canvas id="c" width="400" height="400"></canvas>
    <div id="msg">
      <h2>🐍 SNAKE</h2>
      <p>Eat food. Grow longer. Don't crash!</p>
      <p class="sub">Arrow keys or WASD to move</p>
      <button id="startBtn">▶ Play Now</button>
    </div>
  </div>
  <div id="controls">
    <div class="crow"><button class="cbtn" id="btnU">▲</button></div>
    <div class="crow">
      <button class="cbtn" id="btnL">◀</button>
      <button class="cbtn" id="btnD">▼</button>
      <button class="cbtn" id="btnR">▶</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const GRID = 20, COLS = 20, ROWS = 20;
const COLORS = { snake:'#e8ff47', snakeDark:'#b8cc30', food:'#ff4757', head:'#fff' };

let snake, dir, nextDir, food, score, best, level, speed, gameLoop, running, gameOver;

function init() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  food = spawnFood();
  score = 0; level = 1; speed = 150;
  running = true; gameOver = false;
  updateHUD();
  clearInterval(gameLoop);
  gameLoop = setInterval(tick, speed);
}

function spawnFood() {
  let pos;
  do { pos = {x:Math.floor(Math.random()*COLS), y:Math.floor(Math.random()*ROWS)}; }
  while (snake.some(s => s.x===pos.x && s.y===pos.y));
  return pos;
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) { endGame(); return; }
  // Self collision
  if (snake.some(s => s.x===head.x && s.y===head.y)) { endGame(); return; }

  snake.unshift(head);

  if (head.x===food.x && head.y===food.y) {
    score += 10 * level;
    if (score > best) { best = score; localStorage.setItem('zp_snake_best', best); }
    food = spawnFood();
    // Level up every 50 points
    const newLevel = Math.floor(score / 50) + 1;
    if (newLevel > level) {
      level = newLevel;
      speed = Math.max(60, 150 - (level-1)*15);
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }
    updateHUD();
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid dots
  ctx.fillStyle = '#1a1a2e';
  for (let x=0;x<COLS;x++) for (let y=0;y<ROWS;y++) {
    ctx.fillRect(x*GRID+9, y*GRID+9, 2, 2);
  }

  // Food
  const fx = food.x*GRID, fy = food.y*GRID;
  ctx.shadowBlur = 12; ctx.shadowColor = COLORS.food;
  ctx.fillStyle = COLORS.food;
  ctx.beginPath();
  ctx.arc(fx+GRID/2, fy+GRID/2, GRID/2-2, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake body
  snake.forEach((s, i) => {
    const x = s.x*GRID, y = s.y*GRID;
    if (i === 0) {
      // Head
      ctx.shadowBlur = 8; ctx.shadowColor = COLORS.snake;
      ctx.fillStyle = COLORS.snake;
      ctx.beginPath();
      ctx.roundRect(x+1, y+1, GRID-2, GRID-2, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Eyes
      ctx.fillStyle = '#000';
      const eyeOffsets = dir.x===1?[[12,6],[12,13]]:dir.x===-1?[[6,6],[6,13]]:dir.y===1?[[6,12],[13,12]]:[[6,6],[13,6]];
      eyeOffsets.forEach(([ex,ey]) => { ctx.beginPath(); ctx.arc(x+ex,y+ey,2,0,Math.PI*2); ctx.fill(); });
    } else {
      const alpha = 1 - (i / snake.length) * 0.4;
      ctx.fillStyle = `rgba(184,204,48,${alpha})`;
      ctx.beginPath();
      ctx.roundRect(x+2, y+2, GRID-4, GRID-4, 4);
      ctx.fill();
    }
  });
}

function endGame() {
  running = false; gameOver = true;
  clearInterval(gameLoop);
  // Flash effect
  ctx.fillStyle = 'rgba(255,71,87,0.15)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // Show message
  const msg = document.getElementById('msg');
  msg.style.display = 'flex';
  msg.innerHTML = `
    <h2 style="color:#ff4757">GAME OVER</h2>
    <p style="color:#fff;font-size:1.1rem">Score: <strong style="color:#e8ff47">${score}</strong></p>
    <p style="color:#888">Best: ${best}</p>
    <button id="startBtn" onclick="startGame()">▶ Play Again</button>`;
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('level').textContent = level;
}

function startGame() {
  document.getElementById('msg').style.display = 'none';
  init();
  draw();
}

// Controls
document.addEventListener('keydown', e => {
  if (!running) return;
  const map = {
    ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
    w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
    W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0},
  };
  const newDir = map[e.key];
  if (newDir && !(newDir.x===-dir.x && newDir.y===-dir.y)) {
    nextDir = newDir;
    e.preventDefault();
  }
});

// Mobile buttons
document.getElementById('btnU').addEventListener('click', () => { if(running&&dir.y!==1) nextDir={x:0,y:-1}; });
document.getElementById('btnD').addEventListener('click', () => { if(running&&dir.y!==-1) nextDir={x:0,y:1}; });
document.getElementById('btnL').addEventListener('click', () => { if(running&&dir.x!==1) nextDir={x:-1,y:0}; });
document.getElementById('btnR').addEventListener('click', () => { if(running&&dir.x!==-1) nextDir={x:1,y:0}; });

document.getElementById('startBtn').addEventListener('click', startGame);

// Load best score
best = parseInt(localStorage.getItem('zp_snake_best') || '0');
updateHUD();

// Draw initial state
ctx.fillStyle = '#0a0a0f';
ctx.fillRect(0,0,canvas.width,canvas.height);
</script>
</body>
</html>
